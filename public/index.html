<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171d25">
  <title>Duolocke Z Jalmeida</title>
  <link rel="icon" href="assets/sprites/ball.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Duolocke">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ============ Pantalla de identidad ============ -->
  <div id="identity" class="identity hidden">
    <div class="identity-box">
      <img src="assets/sprites/ball.png" alt="" class="identity-ball">
      <h1 class="logo-text">DUOLOCKE<span>Z</span>JALMEIDA</h1>
      <p class="identity-q">¿Quién eres?</p>
      <div class="identity-buttons">
        <button class="who" data-slug="salda">SALDA</button>
        <button class="who" data-slug="andres">ANDRES</button>
      </div>
      <form id="pin-form" class="pin-form hidden">
        <label for="pin-input">PIN de <b id="pin-who"></b></label>
        <input id="pin-input" type="password" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="PIN">
        <div class="pin-actions">
          <button type="button" id="pin-back" class="ghost">Atrás</button>
          <button type="submit" class="primary">Entrar</button>
        </div>
        <p id="pin-error" class="pin-error"></p>
      </form>
      <button id="spectator" class="link">Solo mirar</button>
    </div>
  </div>

  <!-- ============ Selector de avatar (primera vez) ============ -->
  <div id="avatar-picker" class="identity hidden">
    <div class="identity-box">
      <h1 class="logo-text">ELIGE TU<span>PERSONAJE</span></h1>
      <p id="avatar-q" class="identity-q"></p>
      <div id="avatar-grid" class="avatar-grid"></div>
      <button id="avatar-confirm" class="primary" disabled>Confirmar</button>
      <p id="avatar-error" class="pin-error"></p>
    </div>
  </div>

  <!-- ============ App ============ -->
  <main id="app" class="app hidden">
    <header class="topbar">
      <h1 class="logo-text">DUOLOCKE<span>Z</span>JALMEIDA</h1>
      <button id="whoami" class="whoami"></button>
    </header>

    <button id="news" class="news hidden"></button>

    <section id="banner" class="banner hidden"></section>

    <section class="players">
      <article class="card" data-slot="0"></article>
      <article class="card" data-slot="1"></article>
    </section>

    <section id="checkpoint-box" class="checkpoint-box"></section>

    <section id="graveyard" class="graveyard hidden">
      <h2>☠ Cementerio</h2>
      <div id="graveyard-cols" class="grave-cols"></div>
    </section>

    <section class="history">
      <h2>Historial</h2>
      <ul id="history-list"></ul>
    </section>

    <footer class="foot">
      <span id="sync">—</span>
      <button id="refresh" class="link">Actualizar</button>
    </footer>
  </main>

  <!-- ============ Diálogo de confirmación ============ -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="modal-title"></h3>
      <p id="modal-text"></p>
      <input id="modal-note" class="hidden" type="text" maxlength="120" placeholder="Nota (opcional): murió Fletchling vs rival ruta 4">
      <div id="modal-extra"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="ghost">Cancelar</button>
        <button id="modal-ok" class="primary">Confirmar</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
